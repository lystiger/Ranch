[project]
name = "llm-farm"
version = "0.1.0"
description = "A CLI-based observability and management system for AI models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer[all]",
    "rich",
    "sqlalchemy",
    "pydantic",
    "python-dotenv",
]

[project.scripts]
farm = "farm.main:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
